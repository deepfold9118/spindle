[package]
name = "spindle_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spindle - a build, profile and add-on manager for Blender"

[[bin]]
name = "spindle_app"
path = "src/main.rs"

[dependencies]
eframe = "0.35"
egui = "0.35"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
spindle-core = { path = "../crates/spindle-core" }
anyhow = "1.0.104"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }

[build-dependencies]
png = "0.18"
embed-resource = "3"
