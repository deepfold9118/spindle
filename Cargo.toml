[workspace]
resolver = "3"
members = ["app", "crates/spindle-core", "crates/spindle-launcher", "crates/spindle-mcp"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/deepfold9118/spindle"
authors = ["The Spindle authors"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
