name: Release

# Push a tag like v0.1.0: builds every platform, packs each with the licences, writes
# SHA256SUMS (Spindle's self-update checks downloads against it) and publishes the release
# with the matching section of CHANGELOG.md as its notes.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { platform: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { platform: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        if: matrix.platform != 'macos-x64'
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p spindle_app -p spindle-launcher -p spindle-mcp
      - name: Package
        shell: bash
        run: |
          name="spindle-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          ext=""; [[ "${{ matrix.platform }}" == windows-* ]] && ext=".exe"
          for b in spindle spindle_app spindle-mcp; do
            cp "target/${{ matrix.target }}/release/$b$ext" "dist/$name/"
          done
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.html README.md "dist/$name/"
          if [[ -n "$ext" ]]; then
            cp scripts/install.ps1 "dist/$name/"
          else
            cp scripts/install.sh "dist/$name/"
            cp artwork/spindle_symbol.svg "dist/$name/spindle.svg"
            chmod +x "dist/$name/install.sh"
          fi
          cd dist
          if [[ -n "$ext" ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp scripts/install.ps1 scripts/install.sh dist/
          cd dist && sha256sum spindle-* install.* > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || $2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Spindle $version" > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Spindle ${GITHUB_REF_NAME#v}" --notes-file notes.md
